# =============================================================================
# Clic ID — static site / production nginx config
# Replaces /etc/nginx/nginx.conf inside the nginx:alpine image.
# No conf.d defaults are loaded: this file is the single source of truth.
# =============================================================================

user  nginx;
worker_processes  auto;

error_log  /dev/stderr warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # --- MIME types required by the site -----------------------------------
    # nginx:1.27-alpine already maps txt -> text/plain, xml -> text/xml,
    # webp -> image/webp and avif -> image/avif (verified in /etc/nginx/mime.types).
    # Only webmanifest is missing upstream, so add it without duplicates.
    types {
        application/manifest+json  webmanifest;
    }

    charset       utf-8;
    charset_types text/css text/plain text/xml text/javascript
                  application/javascript application/json
                  application/manifest+json image/svg+xml;

    # Hide nginx version in Server header and error pages
    server_tokens off;

    # Logs go to the container stdout/stderr (captured by Docker / Dokploy)
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'proto=$http_x_forwarded_proto';
    access_log  /dev/stdout main;

    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    # --- gzip ---------------------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   256;
    gzip_proxied      any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        application/xml
        application/xml+rss
        image/svg+xml;

    # --- Cache policy -------------------------------------------------------
    # /assets/                                    -> 1 year, immutable
    # *.html, llms*.txt, robots.txt, sitemap.xml,
    # ai.txt and everything else (css/js at root) -> no-cache (revalidate)
    # /healthz                                    -> no-store
    map $uri $cache_control {
        default                                   "no-cache";
        ~^/assets/                                "public, max-age=31536000, immutable";
        ~*\.html$                                 "no-cache";
        ~*^/llms[^/]*\.txt$                       "no-cache";
        ~*^/(?:robots\.txt|sitemap\.xml|ai\.txt)$ "no-cache";
        ~^/healthz$                               "no-store";
    }

    # --- HSTS only when TLS is terminated in front (Traefik/Dokploy) --------
    # The container itself serves plain HTTP; direct HTTP access must not send
    # HSTS, so the header is emitted only when the proxy says https.
    map $http_x_forwarded_proto $hsts_header {
        default "";
        https   "max-age=31536000; includeSubDomains";
    }

    server {
        listen       80;
        server_name  _;

        root   /usr/share/nginx/html;
        index  index.html;

        # Security headers (inherited by every location)
        add_header X-Content-Type-Options    "nosniff" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options           "SAMEORIGIN" always;
        add_header Strict-Transport-Security $hsts_header always;
        add_header Cache-Control             $cache_control always;

        # Static, no SPA rewrite: exact file, directory (index.html) or
        # file.html; anything else is a real 404.
        try_files $uri $uri/ $uri.html =404;

        # Container/orchestrator health probe
        location = /healthz {
            access_log    off;
            default_type  text/plain;
            return 200 "ok\n";
        }
    }
}
